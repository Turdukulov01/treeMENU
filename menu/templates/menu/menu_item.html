{# menu/templates/menu/menu_item.html #}
<li class="
    menu-item
    {% if node.is_active %}menu-item--active{% endif %}
    {% if node.is_open %}menu-item--open{% endif %}
">
  <a href="{{ node.url }}">{{ node.item.title }}</a>

  {% if node.children %}
    <ul class="menu-children">
      {% for child in node.children %}
        {% include "menu/menu_item.html" with node=child %}
      {% endfor %}
    </ul>
  {% endif %}
</li>
